site_name: Playbook Produit
site_description: Documentation et insights internes des équipes
site_author: Équipe Produit / Tech

theme:
  name: material
  language: fr
  # Optionnel : ajoute un logo si tu en as un dans docs/assets/
  # logo: assets/logo.svg 
  palette:
    # Mode clair (on force l'utilisation de nos couleurs CSS custom)
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
    # Mode sombre
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
  font:
    text: Roboto # Typographie classique
  features:
    - navigation.instant
    - navigation.tabs 
    - navigation.tabs.sticky # Fixe la barre d'onglets au scroll
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.integrate 

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Accueil: index.md
  - "1. Vision, Stratégie et Orga":
      - Vision et approche "Impact Driven": vision/impact-driven.md
      - Operating Model: vision/operating-model.md
  - "2. Découverte Produit":
      - Exploration continue: discovery/exploration.md
      - Validation des opportunités: discovery/validation.md
  - "3. Cadrage":
      - Entonnoir stratégique et Roadmap: cadrage/entonnoir-roadmap.md
      - Taxonomie et découpage: cadrage/taxonomie.md
      - Standardisation (Templates): cadrage/standardisation.md
  - "4. Développement et Livraison":
      - Cadences et rituels: delivery/cadences-rituels.md
      - Exécution et qualité: delivery/execution.md

# --- NOUVEAU BLOC À AJOUTER À LA FIN ---
extra_css:
  - stylesheets/extra.css
