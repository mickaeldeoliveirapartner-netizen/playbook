site_name: Playbook Produit
site_description: Documentation et insights internes des équipes
site_author: Équipe Produit / Tech

theme:
  name: material
  language: fr
  # Optionnel : ajoute un logo si tu en as un dans docs/assets/
  # logo: assets/logo.svg 
  palette:
    # Mode clair (on force l'utilisation de nos couleurs CSS custom)
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
    # Mode sombre
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
  font:
    text: Roboto # Typographie classique
  features:
    - navigation.instant
    - navigation.tabs 
    - navigation.tabs.sticky # Fixe la barre d'onglets au scroll
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.integrate 

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Accueil: index.md
  - "1. Vision & Impact":
      - Pourquoi ? Pour qui ?: vision/pour-qui-pour-quoi.md
      - Approche Impact Driven: vision/impact-driven.md
  - "2. Stratégie & Roadmap":
      - Entonnoir stratégique: strategie/entonnoir-strategique.md
      - Construire la Roadmap: strategie/roadmap.md
  - "3. Operating Model":
      - Définition du modèle: operating-model/definition.md
      - Rôles et Organisation: operating-model/organisation-roles.md
  - "4. Taxonomie & Cadences":
      - Taxonomie et Découpage: execution/taxonomie-decoupage.md
      - Rythmes et Boîtes de temps: execution/cadences-boites-de-temps.md
  - "Boîte à outils":
      - Templates: templates/index.md

# --- NOUVEAU BLOC À AJOUTER À LA FIN ---
extra_css:
  - stylesheets/extra.css
